
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تست بک‌اند مخیار</title>
</head>
<body style="font-family:Tahoma;text-align:center;margin-top:80px">

  <h2>تست اتصال بک‌اند مخیار</h2>

  <button id="testBtn">تست اتصال به Cloudflare</button>
  <button id="sendBtn">ارسال اطلاعات آزمایشی</button>

  <pre id="result" style="direction:ltr;text-align:left;margin:30px auto;max-width:600px;white-space:pre-wrap"></pre>

  <script>
    const WORKER_URL = "https://YOUR-WORKER.workers.dev";

    const result = document.getElementById("result");

    async function request(path, options = {}) {
      result.textContent = "در حال اتصال...";

      try {
        const response = await fetch(WORKER_URL + path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...options.headers
          }
        });

        const data = await response.json();

        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = "خطا در اتصال: " + error.message;
      }
    }

    document.getElementById("testBtn").onclick = () => {
      request("/api/test");
    };

    document.getElementById("sendBtn").onclick = () => {
      request("/api/echo", {
        method: "POST",
        body: JSON.stringify({
          name: "Mokhyar",
          action: "backend_test",
          message: "سلام از فرانت‌اند مخیار!"
        })
      });
    };
  </script>

</body>
</html>
