
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود به مخیار</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10131c;
      color: white;
      font-family: Tahoma, sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border: 1px solid #303747;
      border-radius: 20px;
      background: #191e2b;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #8bb8ff;
    }

    p {
      color: #aab3c5;
      line-height: 1.8;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #loginBtn {
      background: #4285f4;
      color: white;
    }

    #logoutBtn {
      background: #343c4d;
      color: white;
      display: none;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #222a3a;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    #userInfo {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #222a3a;
      border-radius: 12px;
      text-align: right;
      line-height: 2;
    }
  </style>
</head>

<body>

  <main class="login-box">
    <h1>🤖 مخیار</h1>
    <p>برای ورود یا ساخت حساب کاربری، از حساب گوگل خود استفاده کن.</p>

    <button id="loginBtn">
      ورود با گوگل
    </button>

    <button id="logoutBtn">
      خروج از حساب
    </button>

    <div id="status">در حال آماده‌سازی...</div>

    <div id="userInfo">
      <strong>اطلاعات حساب</strong>
      <div id="userName"></div>
      <div id="userEmail"></div>
      <div id="backendStatus"></div>
    </div>
  </main>

  <script type="module">

    // ==========================================
    // 1. وارد کردن Firebase
    // ==========================================

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      signOut,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


    // ==========================================
    // 2. تنظیمات Firebase مخیار
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyD_b3We39OOnxGa-Jw1KAtZS7Q7jT7-ClU",
      authDomain: "mokhyar-ai.firebaseapp.com",
      projectId: "mokhyar-ai",
      storageBucket: "mokhyar-ai.firebasestorage.app",
      messagingSenderId: "490899120010",
      appId: "1:490899120010:web:391b49a94875c43ebbb273",
      measurementId: "G-Q94PN0CMT8"
    };


    // ==========================================
    // 3. آدرس بک‌اند Cloudflare مخیار
    // ==========================================

    const BACKEND_URL =
      "https://mokhyar-backend.yashar-online-store.workers.dev";


    // ==========================================
    // 4. راه‌اندازی Firebase
    // ==========================================

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt: "select_account"
    });


    // ==========================================
    // 5. عناصر صفحه
    // ==========================================

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const statusBox = document.getElementById("status");
    const userInfo = document.getElementById("userInfo");

    const userName = document.getElementById("userName");
    const userEmail = document.getElementById("userEmail");
    const backendStatus = document.getElementById("backendStatus");


    function setStatus(message) {
      statusBox.textContent = message;
    }


    // ==========================================
    // 6. ورود با Google Redirect
    // ==========================================

    loginBtn.addEventListener("click", async () => {
      try {
        loginBtn.disabled = true;

        setStatus("در حال انتقال به صفحه ورود گوگل...");

        await setPersistence(auth, browserLocalPersistence);

        await signInWithRedirect(auth, provider);

      } catch (error) {
        console.error("Login error:", error);

        loginBtn.disabled = false;

        setStatus("خطا در شروع ورود: " + error.message);
      }
    });


    // ==========================================
    // 7. اتصال کاربر به بک‌اند مخیار
    // ==========================================

    let connectedUid = null;
    let connectingUid = null;

    async function connectToBackend(user) {

      if (!user) return;

      // جلوگیری از ارسال درخواست تکراری
      if (connectedUid === user.uid || connectingUid === user.uid) {
        return;
      }

      connectingUid = user.uid;

      backendStatus.textContent = "در حال اتصال به بک‌اند...";

      try {

        // دریافت Firebase ID Token
        const idToken = await user.getIdToken();

        // ارسال توکن به Cloudflare Worker
        const response = await fetch(
          `${BACKEND_URL}/auth/google`,
          {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${idToken}`,
              "Content-Type": "application/json"
            }
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            `خطای سرور: ${response.status}`
          );
        }

        connectedUid = user.uid;

        backendStatus.textContent =
          "اتصال به بک‌اند مخیار موفق بود ✅";

        console.log("Backend response:", data);

      } catch (error) {

        console.error("Backend connection error:", error);

        backendStatus.textContent =
          "خطا در اتصال به بک‌اند: " + error.message;

      } finally {

        connectingUid = null;

      }
    }


    // ==========================================
    // 8. مدیریت وضعیت ورود کاربر
    // ==========================================

    async function initializeAuth() {

      try {

        // بررسی نتیجه بازگشت از صفحه گوگل
        await getRedirectResult(auth);

      } catch (error) {

        console.error("Redirect result error:", error);

        setStatus(
          "خطا در بازگشت از گوگل: " + error.message
        );

      }

      // فقط این قسمت وضعیت کاربر را مدیریت می‌کند.
      // بنابراین درخواست اتصال تکراری ارسال نمی‌شود.

      onAuthStateChanged(auth, async (user) => {

        if (user) {

          loginBtn.style.display = "none";
          logoutBtn.style.display = "block";
          userInfo.style.display = "block";

          userName.textContent =
            "نام: " + (user.displayName || "بدون نام");

          userEmail.textContent =
            "ایمیل: " + (user.email || "بدون ایمیل");

          setStatus("ورود به Firebase موفق بود ✅");

          await connectToBackend(user);

        } else {

          connectedUid = null;
          connectingUid = null;

          loginBtn.style.display = "block";
          loginBtn.disabled = false;

          logoutBtn.style.display = "none";
          userInfo.style.display = "none";

          setStatus("برای استفاده از مخیار وارد حساب خود شو.");

        }

      });

    }


    // ==========================================
    // 9. خروج از حساب
    // ==========================================

    logoutBtn.addEventListener("click", async () => {

      try {

        logoutBtn.disabled = true;

        await signOut(auth);

        setStatus("با موفقیت از حساب خارج شدی.");

      } catch (error) {

        console.error("Logout error:", error);

        setStatus("خطا در خروج: " + error.message);

      } finally {

        logoutBtn.disabled = false;

      }

    });


    // ==========================================
    // 10. شروع برنامه
    // ==========================================

    initializeAuth();

  </script>

</body>
</html>
